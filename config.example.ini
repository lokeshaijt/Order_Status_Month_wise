; Copy this file to config.ini (same folder) and fill in your values.
; config.ini is git-ignored. Never put the password in this file.

[input]
; Folder the NAV Job Queue saves the Order Status report into (UNC path works too)
folder = \\fileserver\Reports\NAV_Export
pattern = OrderStatusRep*CBE_EXP_*.xlsx
; If today's file is not there yet at 10:30, keep checking every poll_minutes for up to wait_minutes
wait_minutes = 30
poll_minutes = 5
; Optional: copy each ERP file here after use (leave empty to skip)
archive_folder =

[output]
folder = D:\OrderStatusReport\out
log_folder = D:\OrderStatusReport\logs
; Use LibreOffice (if installed) to store formula results in the file
recalc = true

[email]
smtp_host = smtp.office365.com
smtp_port = 587
; Service mailbox the report is sent from (SMTP AUTH must be enabled for it by IT)
sender = reports@yourcompany.com
; username defaults to sender
; username = reports@yourcompany.com
; Separate addresses with commas
to = person1@yourcompany.com, person2@yourcompany.com
cc =
subject = Order Status - Month-wise {date}
; Use \n for line breaks. {date} and {summary} are filled in.
body = Dear All,\n\nPlease find attached the Order Status month-wise report as on {date}.\n\n{summary}\n\nThis is an automated e-mail.\n\nRegards

[alerts]
; Who gets the error e-mail if the run fails, and the --dry-run test mail
error_to = you@yourcompany.com
